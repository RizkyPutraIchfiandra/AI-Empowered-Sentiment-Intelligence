services:
  - type: web
    name: moodreader-api
    runtime: python
    plan: free
    rootDir: backend
    # Train during the build so no model binaries live in git. Render keeps the
    # build filesystem for the running service, so the .joblib files persist.
    buildCommand: pip install -r requirements.txt && python train.py
    # One worker on purpose: the free tier caps at 512 MB, and each worker
    # loads its own copy of scikit-learn plus both models.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Set this to your Netlify URL in the Render dashboard. Left unset, the
      # deployed site cannot call the API.
      - key: ALLOWED_ORIGINS
        sync: false
